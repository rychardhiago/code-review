# Default configuration. Copy to the reviewed project's root as
# code-review.yaml and customize its review settings.
version: 1.0

# The hook will review the pushed commit against this configured base branch.
hook: pre-push
base_branch: main

# Report-only policy: findings or review failures must never reject a push.
# Do not enable a blocking gate without explicit approval from project leaders.
push_policy: report_only

# Optional project overrides for security rule IDs in standards/php-standards.md.
# Values: Critical, High, Medium, Low, Warning, or off. Unlisted rules keep
# their catalog defaults.
security_validation_overrides: {}

# Non-interactive GitHub Copilot CLI command. The hook can be installed even
# when `copilot` is not available; in that case it warns and lets the push
# continue without a report. Install/authenticate `copilot` in Git's runtime
# environment (which may differ from the assistant's), or replace this argv
# list with another non-interactive runner.
review_command:
  - copilot
  - -p
  - >-
    Use the code-review skill. This is a pre-push hook invocation. Read the
    CODE_REVIEW_TRIGGER, CODE_REVIEW_BASE_BRANCH, CODE_REVIEW_HEAD_SHA,
    CODE_REVIEW_REVIEW_SCOPE, and CODE_REVIEW_REPORT_PATH environment
    variables. Review the specified commit against the base branch using the
    configured scope, then write the report to the specified path. Do not
    modify project source files.
  - --allow-tool=shell(git:*)
  - --allow-tool=write
  - --no-ask-user

# Languages with a matching standards/<language>-standards.md file are
# reviewed by default. Set enabled: false to explicitly skip a language.
languages: {}

# "diff" reviews only added/modified lines; "full_codebase" reviews the
# complete contents of each changed file, not the entire project.
review_scope: diff

# Report filename pattern, relative to the project root. {commit} is replaced
# by the short hash of the reviewed commit. Defaults to report-{commit}.md.
report_path: report-{commit}.md
